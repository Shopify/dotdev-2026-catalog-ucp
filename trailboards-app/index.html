<!doctype html>

    <!-- Checkout Kit web (alpha): registers <shopify-checkout> for the embedded popup. Loaded by the

      {
        "imports": {
          "@shopify/checkout-kit": "https://esm.sh/@shopify/checkout-kit@4.0.0-alpha.2"
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
